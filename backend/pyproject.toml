[project]
name = "timetable-generator"
version = "0.1.0"
description = "Tharaka University Timetable Generator: the Directorate's constraint-solver timetabling system."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.28,<1",
    "reportlab>=4.2,<5",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "ortools>=9.11,<10",
    "redis>=5,<7",
    "rq>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "types-reportlab>=4.2,<5",
    "pdfplumber>=0.11,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not benchmark\""
markers = ["benchmark: the full-university solve (slow); run with -m benchmark"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E402"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/", "tools/"]

[[tool.mypy.overrides]]
module = ["ortools.*", "rq.*", "docx.*", "openpyxl.*"]
ignore_missing_imports = true
